<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEase - Room Booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f8f9fa;
        }

        .booking-section{
            padding:60px 0;
        }

        .booking-card{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        h2{
            color:#0F172A;
        }

        .btn-book{
            background:#D4AF37;
            color:white;
            border:none;
        }

        .btn-book:hover{
            background:#b8941f;
            color:white;
        }

        body{
    background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1600") center/cover no-repeat fixed;
    min-height:100vh;
}

.booking-section{
    padding:70px 0;
}

.booking-card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.left-side{
    background:#0dcaf0;
    color:#fff;
    padding:40px;
    height:100%;
}

.left-side h2{
    font-weight:bold;
}

.left-side ul{
    list-style:none;
    padding:0;
}

.left-side li{
    margin:18px 0;
    font-size:18px;
}

.right-side{
    padding:40px;
}

.form-control,
.form-select{
    border-radius:10px;
}

.btn-book{
    background:#0dcaf0;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px;
    transition:.3s;
}

.btn-book:hover{
    background:#0997b8;
    transform:translateY(-2px);
}

@media(max-width:768px){

.left-side{
    text-align:center;
}

}
    </style>

    <!-- AOS animation -->

<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>

<section class="booking-section"  data-aos="zoom-in" data-aos-duration="1500">
  <div class="booking-card">

    <div class="row g-0">

        <!-- Left Side -->

        <div class="col-lg-4">

            <div class="left-side">

                <h2>StayEase</h2>

                <p class="mt-3">
                    Book your dream stay in just a few minutes.
                </p>

                <hr>

                <ul>

                    <li>✔ Luxury Rooms</li>

                    <li>✔ Free Wi-Fi</li>

                    <li>✔ Complimentary Breakfast</li>

                    <li>✔ Swimming Pool</li>

                    <li>✔ 24×7 Room Service</li>

                    <li>✔ Free Parking</li>

                </ul>

            </div>

        </div>

        <!-- Right Side -->

        <div class="col-lg-8">

            <div class="right-side">

                <h2 class="text-center mb-4">
                    Room Booking Form
                </h2>

                <form>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" placeholder="9876543210" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Room Type</label>

                            <select class="form-select">

                                <option>Select Room</option>

                                <option>Standard Room</option>

                                <option>Deluxe Room</option>

                                <option>Suite Room</option>

                                <option>Family Room</option>

                            </select>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Check-In</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Check-Out</label>
                            <input type="date" class="form-control">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Guests</label>
                            <input type="number" class="form-control" min="1">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Special Requests</label>
                            <input type="text" class="form-control" placeholder="Optional">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Address</label>

                        <textarea class="form-control" rows="3"></textarea>

                    </div>

                    <button class="btn btn-book w-100">
                        Confirm Booking
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
</section>

<script>
  AOS.init();
</script>
</body>
</html>
